# Type gate for runtime code.
#
# Scope is the code that ships: parser, editor core, entry points, packaging.
# Tests are excluded on purpose - they pass deliberately loose fakes (a str as a
# transport, a two-argument restore stub) to prove the injection boundaries, and
# tightening those would test mypy rather than the editor.
#
# PySide6 and pyooz are optional at runtime, so missing stubs are ignored rather
# than making the gate depend on an installed Qt.

[mypy]
python_version = 3.11
files = app.py, cli.py, save_format.py, steam_cloud.py, editor, ui, packaging
ignore_missing_imports = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
exclude = (?x)(^vendor/|^third_party/|^releases/|^\.local/|^build/|^dist/)
