name: standalone-build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  source-gate:
    name: source gate / Ubuntu 24.04 / Python 3.11
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            appstream libegl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt

      - name: Install test and build dependencies
        shell: python
        run: |
          import subprocess
          import sys

          subprocess.check_call(
              [
                  sys.executable,
                  "-m",
                  "pip",
                  "install",
                  "--requirement",
                  "requirements-build.txt",
                  "--requirement",
                  "requirements-dev.txt",
              ]
          )

      - name: Run complete source gate
        shell: python
        run: |
          import subprocess
          import sys

          commands = (
              [sys.executable, "-m", "ruff", "check", "."],
              [sys.executable, "-m", "mypy"],
              [sys.executable, "tools/render_task_index.py", "--check"],
              [sys.executable, "tools/build_web_bundle.py", "--check"],
              [sys.executable, "tools/export_theme.py", "--check"],
              [
                  sys.executable,
                  "-m",
                  "py_compile",
                  "cli.py",
                  "save_format.py",
                  "steam_cloud.py",
                  "tests/selftest_real.py",
              ],
              [sys.executable, "-m", "pytest", "tests", "-q"],
          )
          for command in commands:
              subprocess.check_call(command)

      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net --strict packaging/com.github.dmitriyde.stalker2saveeditor.metainfo.xml

  package-linux:
    name: Linux portable and Debian / glibc 2.35
    needs: source-gate
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    env:
      QT_QPA_PLATFORM: offscreen
      SAVE_EDITOR_REQUIRE_GLIBC_BASELINE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install baseline build and package dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            ca-certificates curl git dpkg-dev lintian lsb-release \
            libegl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 \
            python3 python3-pip

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test and build dependencies
        shell: python
        run: |
          import subprocess
          import sys

          subprocess.check_call(
              [
                  sys.executable,
                  "-m",
                  "pip",
                  "install",
                  "--requirement",
                  "requirements-build.txt",
                  "--requirement",
                  "requirements-dev.txt",
              ]
          )

      - name: Build Linux artifacts against the declared glibc floor
        shell: python
        env:
          SAVE_EDITOR_TARGET: linux
        run: |
          import subprocess
          import sys

          subprocess.check_call(
              [sys.executable, "packaging/build.py", "--target", "linux", "--output-dir", "artifacts"]
          )

      - name: Run lintian with an explicit informational-tag policy
        shell: bash
        run: |
          set -euo pipefail
          deb="artifacts/stalker2-save-editor_${VERSION:-$(sed -n '1p' VERSION)}_amd64.deb"
          lintian --no-tag-display-limit --pedantic "$deb" > lintian.log 2>&1 || true
          cat lintian.log
          if grep -Eq '^[EW]:' lintian.log; then
            echo 'lintian E:/W: findings are release-blocking; I:/P: findings are informational.' >&2
            exit 1
          fi

      - name: Export package version
        shell: python
        run: |
          import os
          from pathlib import Path

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"VERSION={Path('VERSION').read_text(encoding='utf-8').strip()}\n")

      - name: Smoke packaged diagnostic on Linux
        shell: bash
        run: |
          set -euo pipefail
          archive="artifacts/SaveEditor-linux-x86_64-v${VERSION}.tar.gz"
          mkdir -p smoke
          tar -xzf "$archive" -C smoke
          smoke/SaveEditor/SaveEditor-diagnostic --diagnostic
          native_output="$(timeout 30s smoke/SaveEditor/SaveEditor-native --steam-native-op list)"
          NATIVE_OUTPUT="$native_output" python -c 'import json, os; response=json.loads(os.environ["NATIVE_OUTPUT"]); assert response["type"] in {"Files", "Unavailable", "Error"}, response'

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SaveEditor-linux-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

  package-windows:
    name: Windows portable and installer / Python 3.11
    needs: source-gate
    runs-on: windows-2025
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt

      - name: Install Windows installer tool
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress --yes
          }

      - name: Install build dependencies
        shell: python
        run: |
          import subprocess
          import sys

          subprocess.check_call(
              [sys.executable, "-m", "pip", "install", "--requirement", "requirements-build.txt"]
          )

      - name: Build Windows artifacts
        shell: python
        run: |
          import subprocess
          import sys

          subprocess.check_call(
              [sys.executable, "packaging/build.py", "--target", "windows", "--output-dir", "artifacts"]
          )

      - name: Export package version
        shell: python
        run: |
          import os
          from pathlib import Path

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"VERSION={Path('VERSION').read_text(encoding='utf-8').strip()}\n")

      - name: Smoke packaged diagnostic on Windows
        shell: pwsh
        run: |
          $archive = "artifacts/SaveEditor-windows-x86_64-v$env:VERSION.zip"
          New-Item -ItemType Directory -Force smoke | Out-Null
          Expand-Archive -Path $archive -DestinationPath smoke -Force
          & smoke/SaveEditor/SaveEditor-diagnostic.exe --diagnostic
          $nativeOutput = & smoke/SaveEditor/SaveEditor-native.exe --steam-native-op list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $response = ($nativeOutput -join "`n") | ConvertFrom-Json
          if ($response.type -notin @("Files", "Unavailable", "Error")) { throw "Unexpected native child response: $($response | ConvertTo-Json -Compress)" }

      - name: Smoke Windows installer
        shell: pwsh
        run: |
          $installer = "artifacts/SaveEditor-windows-x86_64-v$env:VERSION-setup.exe"
          $installRoot = Join-Path $PWD "installer-smoke"
          if (-not (Test-Path $installer)) { throw "Windows installer artifact is missing: $installer" }
          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installRoot" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Windows installer failed with exit code $($process.ExitCode)" }
          & "$installRoot/SaveEditor-diagnostic.exe" --diagnostic

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SaveEditor-windows-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

  release:
    name: Publish GitHub Release, R2 and signed APT
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-linux, package-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
      APT_SIGNING_KEY_ID: ${{ secrets.APT_SIGNING_KEY_ID }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate release credentials before external mutations
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN secret is required}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID secret is required}"
          : "${APT_SIGNING_KEY:?APT_SIGNING_KEY secret is required}"
          : "${APT_SIGNING_KEY_ID:?APT_SIGNING_KEY_ID secret is required}"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download native build outputs
        uses: actions/download-artifact@v4
        with:
          pattern: SaveEditor-*-${{ github.sha }}
          path: release-input
          merge-multiple: true

      - name: Install release and APT tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dpkg-dev gnupg apt

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Export package version and deterministic timestamp
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "VERSION=$(sed -n '1p' VERSION)"
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")"
          } >> "$GITHUB_ENV"

      - name: Prepare stable release files
        shell: bash
        run: |
          set -euo pipefail
          python tools/publish_release.py --artifacts release-input --version "$VERSION" --commit "$GITHUB_SHA" --output release-output

      - name: Build signed APT repository
        shell: bash
        run: |
          set -euo pipefail
          apt_home="$RUNNER_TEMP/apt-gnupg"
          key_file="$RUNNER_TEMP/apt-signing-key.asc"
          install -d -m 700 "$apt_home"
          printf '%s\n' "$APT_SIGNING_KEY" > "$key_file"
          GNUPGHOME="$apt_home" gpg --batch --import "$key_file" >/dev/null
          GNUPGHOME="$apt_home" gpg --batch --list-secret-keys "$APT_SIGNING_KEY_ID" >/dev/null
          python tools/build_apt_repo.py \
            --package "release-output/stalker2-save-editor_$(sed -n '1p' VERSION)_amd64.deb" \
            --output release-output/apt \
            --signing-key "$APT_SIGNING_KEY_ID" \
            --gpg-home "$apt_home" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
          rm -f "$key_file"

      - name: Deploy download Worker
        shell: bash
        run: npx --yes wrangler@4 deploy --config infra/downloads-worker/wrangler.toml

      - name: Apply diagnostics retention policy
        shell: bash
        run: npx --yes wrangler@4 r2 bucket lifecycle set save-editor-downloads --file infra/downloads-worker/lifecycle.json --force

      - name: Publish stable R2 objects and verify read-back
        shell: bash
        run: |
          set -euo pipefail
          python tools/publish_release.py --output release-output --prepared --require-apt --publish-r2 --verify-r2

      - name: Verify public APT update and package discovery
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_apt_repo.py \
            --base-url https://save-editor-downloads.save-editor.workers.dev/apt \
            --key-url https://save-editor-downloads.save-editor.workers.dev/apt/repository-key.asc \
            --package stalker2-save-editor \
            --version "$VERSION"

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            release-output/SaveEditor-windows-x86_64.zip
            release-output/SaveEditor-windows-x86_64-setup.exe
            release-output/SaveEditor-linux-x86_64.tar.gz
            release-output/stalker2-save-editor_amd64.deb
            release-output/SHA256SUMS
            release-output/latest.json
            release-output/apt/repository-key.asc
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "$GITHUB_REF_NAME" --generate-notes
          fi
