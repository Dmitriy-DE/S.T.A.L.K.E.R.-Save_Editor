name: standalone-build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.target }} / Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # See .github/workflows/test.yml: only currently hosted runner labels
          # are allowed.  The Linux bundle therefore targets the glibc of
          # ubuntu-24.04; an Ubuntu 22.04 artifact needs a container build and
          # is not claimed by this workflow.
          - os: ubuntu-24.04
            target: linux
          - os: windows-2025
            target: windows

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux packaging and Qt runtime dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dpkg-dev libegl1 libglib2.0-0 libdbus-1-3 libxkbcommon0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt

      - name: Install Windows installer tool
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress --yes
          }

      - name: Install test and build dependencies
        shell: python
        run: |
          import subprocess
          import sys

          subprocess.check_call(
              [
                  sys.executable,
                  "-m",
                  "pip",
                  "install",
                  "--requirement",
                  "requirements-build.txt",
                  "--requirement",
                  "requirements-dev.txt",
              ]
          )

      - name: Run source tests
        shell: python
        run: |
          import subprocess
          import sys

          subprocess.check_call([sys.executable, "-m", "pytest", "tests", "-q"])

      - name: Build standalone artifacts
        shell: python
        env:
          SAVE_EDITOR_TARGET: ${{ matrix.target }}
        run: |
          import subprocess
          import sys

          subprocess.check_call(
              [
                  sys.executable,
                  "packaging/build.py",
                  "--target",
                  "${{ matrix.target }}",
                  "--output-dir",
                  "artifacts",
              ]
          )

      - name: Export package version
        shell: python
        run: |
          import os
          from pathlib import Path

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"VERSION={Path('VERSION').read_text(encoding='utf-8').strip()}\n")

      - name: Smoke packaged diagnostic on Linux
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          archive="artifacts/SaveEditor-linux-x86_64-v${VERSION}.tar.gz"
          mkdir -p smoke
          tar -xzf "$archive" -C smoke
          smoke/SaveEditor/SaveEditor-diagnostic --diagnostic
          native_output="$(timeout 30s smoke/SaveEditor/SaveEditor-native --steam-native-op list)"
          NATIVE_OUTPUT="$native_output" python -c 'import json, os; response=json.loads(os.environ["NATIVE_OUTPUT"]); assert response["type"] in {"Files", "Unavailable", "Error"}, response'

      - name: Smoke packaged diagnostic on Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $archive = "artifacts/SaveEditor-windows-x86_64-v$env:VERSION.zip"
          New-Item -ItemType Directory -Force smoke | Out-Null
          Expand-Archive -Path $archive -DestinationPath smoke -Force
          & smoke/SaveEditor/SaveEditor-diagnostic.exe --diagnostic
          $nativeOutput = & smoke/SaveEditor/SaveEditor-native.exe --steam-native-op list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $response = ($nativeOutput -join "`n") | ConvertFrom-Json
          if ($response.type -notin @("Files", "Unavailable", "Error")) { throw "Unexpected native child response: $($response | ConvertTo-Json -Compress)" }

      - name: Smoke Windows installer
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $installer = "artifacts/SaveEditor-windows-x86_64-v$env:VERSION-setup.exe"
          $installRoot = Join-Path $PWD "installer-smoke"
          if (-not (Test-Path $installer)) { throw "Windows installer artifact is missing: $installer" }
          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installRoot" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Windows installer failed with exit code $($process.ExitCode)" }
          & "$installRoot/SaveEditor-diagnostic.exe" --diagnostic

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SaveEditor-${{ matrix.target }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

  release:
    name: Publish GitHub Release and Cloudflare R2
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download native build outputs
        uses: actions/download-artifact@v4
        with:
          pattern: SaveEditor-*-${{ github.sha }}
          path: release-input
          merge-multiple: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Export package version
        shell: python
        run: |
          import os
          from pathlib import Path

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"VERSION={version}\n")

      - name: Deploy download Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        shell: bash
        run: npx --yes wrangler@4 deploy --config infra/downloads-worker/wrangler.toml

      - name: Prepare stable release files
        shell: bash
        run: |
          set -euo pipefail
          python tools/publish_release.py --artifacts release-input --version "$VERSION" --commit "$GITHUB_SHA" --output release-output

      - name: Publish stable R2 objects and verify read-back
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          python tools/publish_release.py --artifacts release-input --version "$VERSION" --commit "$GITHUB_SHA" --output release-output --publish-r2 --verify-r2

      - name: Warn when R2 credentials are unavailable
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        shell: bash
        run: echo '::warning::Cloudflare secrets are unavailable; GitHub assets will publish, but Worker/R2 publication was skipped.'

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            release-output/SaveEditor-windows-x86_64.zip
            release-output/SaveEditor-windows-x86_64-setup.exe
            release-output/SaveEditor-linux-x86_64.tar.gz
            release-output/stalker2-save-editor_amd64.deb
            release-output/SHA256SUMS
            release-output/latest.json
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "$GITHUB_REF_NAME" --generate-notes
          fi
